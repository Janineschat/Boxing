      var l = window.location;
      if (l.pathname.indexOf("/Boxing/boxing-react/dist") === -1) {
        l.replace(
          l.protocol + "//" + l.hostname + "/Boxing/boxing-react/dist" + l.pathname
        );

    <script>
      // Herstel pad uit GitHub Pages SPA-redirect (?/route)
      (function (location) {
        if (location.search[1] === "/") {
          var decoded = location.search
            .slice(1)
            .split("&")
            .map(function (part) {
              return part.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            location.pathname.slice(0, -1) + decoded + location.hash
          );
        }
      })(window.location);
    </script>
